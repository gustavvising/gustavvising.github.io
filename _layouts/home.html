---
layout: default
---

<p style="margin-bottom: 24px;">
  A cybersecurity blog.
</p>

<div class="social-links-home" style="margin-bottom: 4px;">
  <a href="https://github.com/gustavvising" target="_blank">GitHub ↗</a>
</div>

<hr style="margin: 40px 0 0 0 !important;">

{{ content }}

<h2 style="margin-top: 0 !important; margin-bottom: 25px !important;">Posts</h2>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
      <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    </li>
  {% endfor %}
</ul>
