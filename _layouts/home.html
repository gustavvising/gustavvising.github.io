layout: default
---

<div id="memory-bg"></div>

<div class="memory-page-content">

  <p style="margin-bottom: 20px;">
    A cybersecurity blog.
  </p>

 <div style="margin-bottom: 6px;">
  <a href="mailto:gustav@gustavvising.se">Email ↗</a>
  <a href="https://www.linkedin.com/in/gustavvising/" target="_blank" style="margin-left: 12px;">LinkedIn ↗</a>
  <a href="https://github.com/gustavvising" target="_blank" style="margin-left: 12px;">GitHub ↗</a>
</div>

  <hr style="margin: 0 0 40px 0;">

  {{ content }}

  <h2 style="margin-top: 0 !important; margin-bottom: 25px !important;">Posts</h2>

  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
      </li>
    {% endfor %}
  </ul>

</div>

<script src="{{ '/assets/js/memory.js' | relative_url }}"></script>
