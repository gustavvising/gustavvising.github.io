<div class="social-links-home" style="margin-bottom: 20px;">
  <a href="https://github.com/gustavvising" target="_blank">GitHub</a> | 
  <a href="https://linkedin.com/in/gustav-vising" target="_blank">LinkedIn</a>
</div>

<hr>

{{ content }}

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
      <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    </li>
  {% endfor %}
</ul>
